/* ---------------- SEO básico: título y descripción por página ---------------- */

function useDocumentMeta(title, description) {
  useEffect(() => {
    if (typeof document === "undefined") return;
    document.title = title;
    let meta = document.querySelector('meta[name="description"]');
    if (!meta) {
      meta = document.createElement("meta");
      meta.setAttribute("name", "description");
      document.head.appendChild(meta);
    }
    meta.setAttribute("content", description);
  }, [title, description]);
}

function slugify(text) {
  const base = text
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s-]/g, "")
    .trim()
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-");
  return base || `articulo-${Date.now()}`;
}

/* ---------------- Utilidades de fecha ---------------- */

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS_SEMANA = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DIAS_CORTOS = ["lun","mar","mié","jue","vie","sáb","dom"];

const pad = (n) => String(n).padStart(2, "0");
const toKey = (date) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
const parseKey = (key) => {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const startOfDay = (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate());
const isSameDay = (a, b) => a && b && toKey(a) === toKey(b);

function formatLongDate(dateKey) {
  const date = parseKey(dateKey);
  const w = DIAS_SEMANA[date.getDay()];
  return `${w} ${date.getDate()} de ${MESES[date.getMonth()]}`;
}

function formatTime(time) {
  const [h, m] = time.split(":").map(Number);
  const suffix = h < 12 ? "a.m." : "p.m.";
  const hour12 = h % 12 === 0 ? 12 : h % 12;
  return `${hour12}:${pad(m)} ${suffix}`;
}

const isWorkday = (doctor, date) => doctor.workdays.includes(date.getDay());
const isPast = (date) => startOfDay(date) < startOfDay(new Date());

function bookedTimes(appointments, doctorId, dateKey) {
  return appointments.filter((a) => a.doctorId === doctorId && a.date === dateKey).map((a) => a.time);
}
function isDayFull(doctor, appointments, date) {
  const taken = bookedTimes(appointments, doctor.id, toKey(date));
  return doctor.slots.every((slot) => taken.includes(slot));
}
function isDaySelectable(doctor, appointments, date) {
  return isWorkday(doctor, date) && !isPast(date) && !isDayFull(doctor, appointments, date);
}

function getMonthGrid(monthDate) {
  const first = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  const startOffset = (first.getDay() + 6) % 7; // lunes = 0
  const gridStart = new Date(first);
  gridStart.setDate(first.getDate() - startOffset);
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    days.push(d);
  }
  return days;
}

  ink: "#123350", ink700: "#1B4666", sea: "#2C6E8E", sea500: "#3C87AA",
  sea300: "#8FBACE", sea100: "#D7E7EF", mist: "#EEF5F8", white: "#FFFFFF"
};

const GlobalStyle = () => (
  <style>{`
    .ayc { font-family: 'Inter', system-ui, sans-serif; color:${COLORS.ink}; background:${COLORS.white}; }
    .ayc-serif { font-family: 'Lora', Georgia, serif; }
    .ayc-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; font-size:0.875rem; font-weight:500; padding:12px 26px; cursor:pointer; transition:all .15s ease; border:none; }
    .ayc-btn-dark { background:${COLORS.ink}; color:#fff; }
    .ayc-btn-dark:hover { background:${COLORS.ink700}; }
    .ayc-btn-dark:disabled { background:rgba(18,51,80,0.3); cursor:not-allowed; }
    .ayc-btn-outline { background:#fff; color:${COLORS.ink}; border:1px solid rgba(18,51,80,0.15); }
    .ayc-btn-outline:hover { border-color:${COLORS.sea}; color:${COLORS.sea}; }
    .ayc-btn-whats { background:#128C7E; color:#fff; }
    .ayc-btn-whats:hover { background:#0f7568; }
    .ayc-card { background:#fff; border-radius:24px; box-shadow:0 1px 2px rgba(18,51,80,0.04), 0 12px 32px -18px rgba(18,51,80,0.30); }
    .ayc-input { width:100%; border-radius:12px; border:1px solid ${COLORS.sea100}; padding:12px 16px; font-size:0.875rem; outline:none; box-sizing:border-box; font-family:inherit; }
    .ayc-input:focus { border-color:${COLORS.sea}; box-shadow:0 0 0 3px rgba(44,110,142,0.15); }
    .ayc-nav-link { background:none; border:none; font-size:0.875rem; color:${COLORS.ink700}; cursor:pointer; }
    .ayc-nav-link:hover { color:${COLORS.sea}; }

    /* ---- Sensación de app nativa: feedback táctil y transiciones ---- */
    * { -webkit-tap-highlight-color: transparent; }
    button, a { transition: transform .12s ease, opacity .12s ease, box-shadow .12s ease; }
    button:active, a.ayc-btn:active, .ayc-card:active { transform: scale(0.97); }
    .ayc-page-enter { animation: ayc-fade-up .28s cubic-bezier(.22,.68,0,1.01) both; }
    @keyframes ayc-fade-up { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    html { scroll-behavior: smooth; }
    body { -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }

    /* ---- Barra de navegación inferior (solo mobile) ---- */
    .ayc-tabbar { display: none; }

    @media (max-width: 860px) {
      .ayc-desktop-nav { display: none !important; }
    }
    @media (max-width: 720px) {
      header { padding-top: env(safe-area-inset-top); }
      .ayc-tabbar {
        display: flex;
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
        background: rgba(255,255,255,0.94); backdrop-filter: blur(14px);
        border-top: 1px solid ${COLORS.sea100};
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
        box-shadow: 0 -8px 24px -12px rgba(18,51,80,0.18);
      }
      .ayc-tabbar-item {
        flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
        background: none; border: none; cursor: pointer; padding: 6px 2px;
      }
      .ayc-tabbar-label { font-size: 10.5px; letter-spacing: 0.01em; }
      .ayc-tabbar-primary { margin-top: -22px; }
      .ayc-tabbar-primary-btn {
        width: 46px; height: 46px; border-radius: 50%;
        background: linear-gradient(135deg, ${COLORS.sea500}, ${COLORS.ink});
        color: #fff; display: grid; place-items: center;
        box-shadow: 0 10px 22px -8px rgba(18,51,80,0.55);
        border: 3px solid #fff;
      }
      .ayc-whats-fab { bottom: calc(78px + env(safe-area-inset-bottom)) !important; }
      body { padding-bottom: calc(62px + env(safe-area-inset-bottom)); }
    }
    @media (max-width: 720px) {
      .ayc-featured-post { grid-template-columns: 1fr !important; }
      .ayc-post-cover { width: 96px !important; min-height: 96px !important; }
      .ayc-testimonials-grid { grid-template-columns: 1fr 1fr !important; }
      .ayc-specialties-grid { grid-template-columns: 1fr !important; }
      .ayc-doctors-grid { grid-template-columns: 1fr !important; }
      .ayc-doctor-card { flex-direction: column !important; }
      .ayc-doctor-card-photo { width: 100% !important; height: 240px !important; min-height: 240px !important; }
      .ayc-contact-grid { grid-template-columns: 1fr !important; }
      .ayc-doctorpicker-grid { grid-template-columns: 1fr !important; }
      .ayc-hero-grid { grid-template-columns: 1fr !important; padding: 32px 20px 56px !important; gap: 28px !important; }
      .ayc-howitworks-grid { grid-template-columns: 1fr !important; gap: 28px !important; }
      .ayc-booking-grid { grid-template-columns: 1fr !important; }
      section { padding-top: 48px !important; padding-bottom: 48px !important; }
    }
  `}</style>
);

  rivas: { skin: "#6B4226", skinShade: "#57351D", hair: "#150E0B" }
};

function DoctorIllustration({ doctorId, size = 96, style }) {
  const tone = PORTRAIT_TONES[doctorId] || PORTRAIT_TONES.beltran;
  const isRivas = doctorId === "rivas";
  return (
    <svg viewBox="0 0 100 100" width={size} height={size} style={style} role="img" aria-label="Retrato referencial del médico">
      <circle cx="50" cy="50" r="50" fill={COLORS.mist} />
      {/* bata / hombros */}
      <path d="M18 100 C18 76 32 66 50 66 C68 66 82 76 82 100 Z" fill="#FFFFFF" />
      <path d="M18 100 C18 76 32 66 50 66 C68 66 82 76 82 100" fill="none" stroke={COLORS.sea100} strokeWidth="1.5" />
      <path d="M41 68 L50 82 L59 68" fill="none" stroke={COLORS.sea300} strokeWidth="2" strokeLinejoin="round" />
      {/* estetoscopio */}
      <path d="M39 71 C39 80 44 85 50 85 C56 85 61 80 61 71" fill="none" stroke={COLORS.sea} strokeWidth="2.2" strokeLinecap="round" />
      <circle cx="61" cy="72" r="3" fill={COLORS.sea} />
      {/* cuello */}
      <rect x="41" y="56" width="18" height="16" rx="7" fill={tone.skinShade} />
      {/* cabeza */}
      <ellipse cx="50" cy="41" rx="21" ry="23" fill={tone.skin} />
      {/* cabello */}
      {isRivas ? (
        <path d="M27 42 C24 20 34 8 50 8 C66 8 76 20 73 42 C72 29 65 21 50 21 C35 21 28 29 27 42 Z" fill={tone.hair} />
      ) : (
        <path d="M28 33 C27 16 37 8 50 8 C63 8 73 16 72 33 C70 21 61 17 50 17 C39 17 30 21 28 33 Z" fill={tone.hair} />
      )}
      {/* rasgos simples */}
      <circle cx="42.5" cy="43" r="2.1" fill="#233240" />
      <circle cx="57.5" cy="43" r="2.1" fill="#233240" />
      <path d="M43 53 Q50 58 57 53" stroke="#233240" strokeWidth="2" fill="none" strokeLinecap="round" />
    </svg>
  );
}

function DoctorPhotoFill({ doctorId, style }) {
  const [failed, setFailed] = useState(false);
  const src = DOCTOR_PHOTOS[doctorId];

  if (!src || failed) {
    return (
      <div style={{ width: "100%", height: "100%", display: "grid", placeItems: "center", background: COLORS.mist, ...style }}>
        <DoctorIllustration doctorId={doctorId} size={96} />
      </div>
    );
  }
  return (
    <div style={{ position: "relative", width: "100%", height: "100%", overflow: "hidden", background: COLORS.mist, ...style }}>
      <img
        src={src}
        alt=""
        aria-hidden="true"
        onError={() => setFailed(true)}
        style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", filter: "blur(20px) saturate(1.15)", transform: "scale(1.25)", opacity: 0.6 }}
      />
      <img
        src={src}
        alt="Foto del médico"
        onError={() => setFailed(true)}
        style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "contain" }}
      />
    </div>
  );
}

function DoctorPortrait({ doctorId, size = 96, style }) {
  const [failed, setFailed] = useState(false);
  const src = DOCTOR_PHOTOS[doctorId];

  if (!src || failed) {
    return <DoctorIllustration doctorId={doctorId} size={size} style={style} />;
  }
  return (
    <img
      src={src}
      alt="Foto del médico"
      width={size}
      height={size}
      onError={() => setFailed(true)}
      style={{ width: size, height: size, objectFit: "cover", objectPosition: "center 18%", display: "block", ...style }}
    />
  );
}

/* ---------------- Portadas referenciales de artículos ---------------- */

function hashSlug(slug) {
  let h = 0;
  for (let i = 0; i < slug.length; i++) h = (h * 31 + slug.charCodeAt(i)) >>> 0;
  return h;
}

  la ilustración de reemplazo.

function ArticleCover({ post, style }) {
  const [failed, setFailed] = useState(false);
  const src = ARTICLE_IMAGES[post.slug];

  if (src && !failed) {
    return (
      <img
        src={src}
        alt={post.title}
        onError={() => setFailed(true)}
        style={{ width: "100%", height: "100%", objectFit: "cover", display: "block", ...style }}
      />
    );
  }
  return <ArticleCoverIllustration post={post} style={style} />;
}

function ArticleCoverIllustration({ post, style }) {
  const isHema = post.category === "Hematología";
  const variant = hashSlug(post.slug) % 2;
  const [c1, c2] = isHema ? [COLORS.ink, COLORS.sea500] : [COLORS.sea500, COLORS.ink];
  const gradId = `cover-grad-${post.slug}`;
  return (
    <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" style={{ width: "100%", height: "100%", display: "block", ...style }} role="img" aria-label="Ilustración referencial del artículo">
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={c1} />
          <stop offset="100%" stopColor={c2} />
        </linearGradient>
      </defs>
      <rect width="400" height="200" fill={`url(#${gradId})`} />
      {isHema ? (
        variant === 0 ? (
          <>
            <circle cx="70" cy="70" r="26" fill="rgba(255,255,255,0.14)" />
            <circle cx="70" cy="70" r="26" fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="2" />
            <circle cx="150" cy="130" r="18" fill="rgba(255,255,255,0.12)" />
            <circle cx="260" cy="60" r="34" fill="rgba(255,255,255,0.10)" />
            <circle cx="260" cy="60" r="34" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="2" />
            <circle cx="330" cy="140" r="14" fill="rgba(255,255,255,0.16)" />
            <circle cx="200" cy="170" r="10" fill="rgba(255,255,255,0.2)" />
          </>
        ) : (
          <>
            <circle cx="100" cy="150" r="30" fill="rgba(255,255,255,0.12)" />
            <circle cx="100" cy="150" r="30" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="2" />
            <circle cx="220" cy="60" r="22" fill="rgba(255,255,255,0.14)" />

          </>
        )
      ) : variant === 0 ? (
        <>
          <path d="M0 140 C 80 100, 140 170, 220 120 S 340 70, 400 100" stroke="rgba(255,255,255,0.35)" strokeWidth="3" fill="none" />
          <path d="M0 170 C 90 150, 160 190, 240 150 S 340 110, 400 140" stroke="rgba(255,255,255,0.2)" strokeWidth="2" fill="none" />

      ) : (
        <>
          <path d="M0 90 C 70 130, 150 60, 230 100 S 330 150, 400 110" stroke="rgba(255,255,255,0.35)" strokeWidth="3" fill="none" />

function Logo() {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
      <img src={CLINIC_LOGO_ICON} alt="Almas & Células" style={{ width: 44, height: 44, objectFit: "contain", flexShrink: 0 }} />
      <div>
        <div className="ayc-serif" style={{ fontSize: 18, lineHeight: 1.1 }}>Almas & Células</div>
        <div style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: COLORS.sea }}>Hematología · Psiquiatría</div>
      </div>
    </div>
  );
}

function Header({ page, goHome, goSection, goBooking, goAdmin, goBlog }) {
  const [open, setOpen] = useState(false);
  const NAV = [
    { id: "especialidades", label: "Especialidades", type: "section" },
    { id: "doctores", label: "Doctores", type: "section" },
    { id: "blog", label: "Blog", type: "page" },
    { id: "preguntas-frecuentes", label: "Preguntas", type: "section" },
    { id: "contacto", label: "Contacto", type: "section" }
  ];
  const handleNav = (item) => (item.type === "page" ? goBlog() : goSection(item.id));
  return (
    <header style={{ position: "sticky", top: 0, zIndex: 40, borderBottom: `1px solid ${COLORS.sea100}`, background: "rgba(255,255,255,0.92)", backdropFilter: "blur(8px)" }}>
      <div style={{ maxWidth: 1120, margin: "0 auto", padding: "0 20px", height: 72, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <button onClick={goHome} style={{ background: "none", border: "none", cursor: "pointer", padding: 0 }} aria-label="Almas & Células, inicio">
          <Logo />
        </button>
        <nav style={{ display: "flex", gap: 28 }} className="ayc-desktop-nav">
          {NAV.map((item) => (
            <button key={item.id} className="ayc-nav-link" onClick={() => handleNav(item)}>{item.label}</button>
          ))}
        </nav>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button className="ayc-btn ayc-btn-dark" style={{ padding: "10px 20px" }} onClick={() => goBooking()}>
            <CalendarPlusIcon size={16} /> Agendar cita
          </button>
          <button onClick={() => setOpen((v) => !v)} aria-label="Menú" style={{ width: 40, height: 40, borderRadius: "50%", border: `1px solid ${COLORS.sea100}`, background: "#fff", display: "grid", placeItems: "center", cursor: "pointer" }}>
            {open ? <XIcon size={18} /> : <MenuIcon size={18} />}
          </button>
        </div>
      </div>
      {open && (
        <div style={{ borderTop: `1px solid ${COLORS.sea100}`, background: "#fff", padding: "8px 20px 16px" }}>
          {NAV.map((item) => (
            <button key={item.id} onClick={() => { setOpen(false); handleNav(item); }} style={{ display: "block", width: "100%", textAlign: "left", padding: "10px 0", background: "none", border: "none", fontSize: 14, color: COLORS.ink700, cursor: "pointer" }}>{item.label}</button>
          ))}
          <button onClick={() => { setOpen(false); goAdmin(); }} style={{ display: "block", width: "100%", textAlign: "left", padding: "10px 0", background: "none", border: "none", fontSize: 14, color: COLORS.sea, cursor: "pointer" }}>Panel del consultorio</button>
        </div>
      )}
    </header>
  );
}

/* ---------------- Home: Hero ---------------- */

function Hero({ goBooking }) {
  const [imgFailed, setImgFailed] = useState(false);
  return (
    <section style={{ background: COLORS.mist }}>
      <div style={{ maxWidth: 1120, margin: "0 auto", padding: "56px 20px", display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 40, alignItems: "center" }} className="ayc-hero-grid">
        <div>
          <p style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, color: COLORS.sea, marginBottom: 18 }}>
            <MapPinIcon size={16} /> Valera, estado Trujillo
          </p>
          <h1 className="ayc-serif" style={{ fontSize: "clamp(2rem,4vw,3rem)", lineHeight: 1.12, margin: 0 }}>
            Atendemos la sangre y la mente con la misma atención.
          </h1>
          <p style={{ marginTop: 20, maxWidth: 520, fontSize: 17, lineHeight: 1.6, color: "rgba(18,51,80,0.75)" }}>
            Almas & Células reúne hematología y psiquiatría en un mismo consultorio. Dos especialistas, una historia clínica y el tiempo necesario para escucharte antes de indicar nada.
          </p>
          <div style={{ display: "flex", gap: 12, marginTop: 30, flexWrap: "wrap" }}>
            <button className="ayc-btn ayc-btn-dark" onClick={() => goBooking()}>
              <CalendarPlusIcon size={16} /> Agendar cita en línea
            </button>
            <a className="ayc-btn ayc-btn-outline" href={GENERAL_WHATSAPP} target="_blank" rel="noopener noreferrer">
              <MessageCircleIcon size={16} /> Escribir por WhatsApp
            </a>
          </div>
          <dl style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 20, marginTop: 40, paddingTop: 24, borderTop: `1px solid ${COLORS.sea100}`, maxWidth: 480 }}>
            {[["2","Especialidades bajo un mismo techo"],["48 h","Tiempo promedio para una cita"],["Piso 11","C.C. Plaza, local 2"]].map(([k,v]) => (
              <div key={v}>
                <dt className="ayc-serif" style={{ fontSize: 22 }}>{k}</dt>
                <dd style={{ margin: 0, marginTop: 4, fontSize: 11, lineHeight: 1.3, color: "rgba(18,51,80,0.6)" }}>{v}</dd>
              </div>
            ))}
          </dl>
        </div>
        <div style={{ position: "relative", height: 320, borderRadius: 28, background: `linear-gradient(135deg, ${COLORS.sea500}, ${COLORS.ink})`, boxShadow: "0 30px 60px -20px rgba(18,51,80,0.45)" }}>
          <div style={{ position: "absolute", inset: 0, borderRadius: 28, overflow: "hidden" }}>
            {!imgFailed && (
              <img
                src={HERO_IMAGE_URL}
                alt="Consulta médica en Almas & Células"
                onError={() => setImgFailed(true)}
                style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }}

function PatientForm({ ready, modality, onSubmit }) {
  const [data, setData] = useState({ patientName: "", phone: "", email: "", reason: "", homeAddress: "" });
  const [errors, setErrors] = useState({});
  const [showReadyWarning, setShowReadyWarning] = useState(false);

  const update = (key, value) => {
    setData((prev) => ({ ...prev, [key]: value }));
    setErrors((prev) => ({ ...prev, [key]: undefined }));
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!ready) {
      setShowReadyWarning(true);
      return;
    }
    setShowReadyWarning(false);
    const next = {};
    if (data.patientName.trim().length < 3) next.patientName = "Escribe tu nombre completo.";
    if (data.phone.replace(/\D/g, "").length < 10) next.phone = "Escribe un teléfono válido con código de área.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email.trim())) next.email = "Escribe un correo válido, para enviarte la confirmación y el recordatorio.";
    if (data.reason.trim().length < 5) next.reason = "Cuéntanos brevemente el motivo.";
    if (modality === "domicilio" && data.homeAddress.trim().length < 8) next.homeAddress = "Escribe la dirección donde te visitará el doctor.";
    setErrors(next);
    if (Object.keys(next).length > 0) return;
    onSubmit({
      patientName: data.patientName.trim(),
      phone: data.phone.trim(),
      email: data.email.trim(),
      reason: data.reason.trim(),
      homeAddress: modality === "domicilio" ? data.homeAddress.trim() : ""
    });
  };

  return (
    <form onSubmit={handleSubmit} noValidate>
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div>
          <label style={{ fontSize: 13, fontWeight: 500 }}>Nombre completo</label>
          <input className="ayc-input" style={{ marginTop: 6 }} value={data.patientName} onChange={(e) => update("patientName", e.target.value)} placeholder="Ej. María Colmenares" />
          {errors.patientName && <p style={{ margin: "6px 0 0", fontSize: 12, color: "#dc2626" }}>{errors.patientName}</p>}
        </div>
        <div>
          <label style={{ fontSize: 13, fontWeight: 500 }}>Teléfono</label>
          <input className="ayc-input" style={{ marginTop: 6 }} type="tel" value={data.phone} onChange={(e) => update("phone", e.target.value)} placeholder="Ej. 0414 123 4567" />
          {errors.phone && <p style={{ margin: "6px 0 0", fontSize: 12, color: "#dc2626" }}>{errors.phone}</p>}
        </div>
        <div>
          <label style={{ fontSize: 13, fontWeight: 500 }}>Correo electrónico</label>
          <input className="ayc-input" style={{ marginTop: 6 }} type="email" value={data.email} onChange={(e) => update("email", e.target.value)} placeholder="Ej. maria@correo.com" />
          {errors.email && <p style={{ margin: "6px 0 0", fontSize: 12, color: "#dc2626" }}>{errors.email}</p>}
          <p style={{ margin: "6px 0 0", fontSize: 11, color: "rgba(18,51,80,0.5)" }}>Aquí recibirás la confirmación y el recordatorio de tu cita.</p>
        </div>
        {modality === "domicilio" && (
          <div>
            <label style={{ fontSize: 13, fontWeight: 500 }}>Dirección para la visita</label>
            <input className="ayc-input" style={{ marginTop: 6 }} value={data.homeAddress} onChange={(e) => update("homeAddress", e.target.value)} placeholder="Urbanización, calle, casa/apto, punto de referencia" />
            {errors.homeAddress && <p style={{ margin: "6px 0 0", fontSize: 12, color: "#dc2626" }}>{errors.homeAddress}</p>}
          </div>
        )}
        <div>
          <label style={{ fontSize: 13, fontWeight: 500 }}>Motivo de la consulta</label>
          <textarea className="ayc-input" style={{ marginTop: 6, resize: "none" }} rows={3} value={data.reason} onChange={(e) => update("reason", e.target.value)} placeholder="En una o dos líneas: qué te trae a consulta." />
          {errors.reason && <p style={{ margin: "6px 0 0", fontSize: 12, color: "#dc2626" }}>{errors.reason}</p>}
        </div>
      </div>
      {showReadyWarning && !ready && (
        <p style={{ marginTop: 16, padding: "10px 14px", borderRadius: 10, background: "#FEF2F2", border: "1px solid #FCA5A5", fontSize: 13, color: "#B91C1C" }}>
          Antes de confirmar, sube y elige un día en el calendario y un horario disponible (pasos 2 y 3).
        </p>
      )}
      <button type="submit" className="ayc-btn ayc-btn-dark" style={{ width: "100%", marginTop: 22, opacity: ready ? 1 : 0.55 }}>Confirmar cita</button>
      <p style={{ marginTop: 10, textAlign: "center", fontSize: 11, color: "rgba(18,51,80,0.5)" }}>Al confirmar, aceptas que usemos tus datos solo para gestionar tu cita, según nuestra política de privacidad.</p>
      {!ready && !showReadyWarning && <p style={{ marginTop: 10, textAlign: "center", fontSize: 12, color: "rgba(18,51,80,0.6)" }}>Elige fecha y hora para poder confirmar.</p>}
    </form>
  );
}

function Booking({ initialDoctor, appointments, addAppointment }) {
  const [doctorId, setDoctorId] = useState(initialDoctor || "beltran");
  const [modality, setModality] = useState("presencial");
  const [date, setDate] = useState(null);
  const [time, setTime] = useState(null);
  const [confirmed, setConfirmed] = useState(null);

  const doctor = getDoctor(doctorId);
  const dateKey = date ? toKey(date) : null;

  const handleDoctorChange = (id) => {
    setDoctorId(id);
    setTime(null);
    if (date && !isDaySelectable(getDoctor(id), appointments, date)) setDate(null);
  };
  const handleDateChange = (d) => { setDate(d); setTime(null); };
  const handleSubmit = (data) => {
    if (!dateKey || !time) return;
    const created = { id: `cita-${Date.now()}`, doctorId, date: dateKey, time, status: "pendiente", modality, meetingLink: null, ...data };
    addAppointment(created);
    setConfirmed(created);
    // Aviso automático al consultorio por WhatsApp con los datos de la cita
    window.open(whatsappLink(appointmentMessage(created, getDoctor(doctorId))), "_blank", "noopener,noreferrer");
  };
  const resetFlow = () => { setConfirmed(null); setDate(null); setTime(null); };

  if (confirmed) {
    return (
      <main style={{ background: COLORS.mist, padding: "56px 0" }}>
        <div style={{ maxWidth: 1120, margin: "0 auto", padding: "0 20px" }}>
          <BookingSuccess appointment={confirmed} doctor={getDoctor(confirmed.doctorId)} onNew={resetFlow} />
        </div>
      </main>
    );
  }

  return (
    <main style={{ background: COLORS.mist, padding: "48px 0" }}>
      <div style={{ maxWidth: 1120, margin: "0 auto", padding: "0 20px" }}>
        <header style={{ maxWidth: 560 }}>
          <h1 className="ayc-serif" style={{ fontSize: "clamp(1.8rem,3.5vw,2.4rem)" }}>Agenda tu cita</h1>
          <p style={{ marginTop: 10, color: "rgba(18,51,80,0.75)" }}>Elige especialista, día y hora. Solo verás los horarios que están realmente libres.</p>
        </header>
        <div style={{ marginTop: 32, display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 24, alignItems: "start" }} className="ayc-booking-grid">
          <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
            <section className="ayc-card" style={{ padding: 26 }}>
              <DoctorPicker value={doctorId} onChange={handleDoctorChange} />
            </section>
            <section className="ayc-card" style={{ padding: 26 }}>
              <h2 className="ayc-serif" style={{ margin: 0, fontSize: 19 }}>2. Tipo de consulta</h2>
              <div style={{ marginTop: 16, display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
                <button type="button" onClick={() => setModality("presencial")} style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 8, borderRadius: 14, border: `1px solid ${modality === "presencial" ? COLORS.sea : COLORS.sea100}`, background: modality === "presencial" ? COLORS.mist : "#fff", padding: 14, cursor: "pointer", textAlign: "left" }}>
                  <MapPinnedIcon size={18} style={{ color: COLORS.sea }} />
                  <span>
                    <span style={{ display: "block", fontWeight: 500, fontSize: 14 }}>Presencial</span>
                    <span style={{ display: "block", fontSize: 12, color: "rgba(18,51,80,0.6)" }}>En el consultorio</span>
                  </span>
                </button>
                <button type="button" onClick={() => setModality("virtual")} style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 8, borderRadius: 14, border: `1px solid ${modality === "virtual" ? COLORS.sea : COLORS.sea100}`, background: modality === "virtual" ? COLORS.mist : "#fff", padding: 14, cursor: "pointer", textAlign: "left" }}>
                  <VideoIcon size={18} style={{ color: COLORS.sea }} />
                  <span>
                    <span style={{ display: "block", fontWeight: 500, fontSize: 14 }}>Videoconsulta</span>
                    <span style={{ display: "block", fontSize: 12, color: "rgba(18,51,80,0.6)" }}>Por Google Meet</span>
                  </span>
                </button>
                <button type="button" onClick={() => setModality("domicilio")} style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 8, borderRadius: 14, border: `1px solid ${modality === "domicilio" ? COLORS.sea : COLORS.sea100}`, background: modality === "domicilio" ? COLORS.mist : "#fff", padding: 14, cursor: "pointer", textAlign: "left" }}>
                  <HomeIcon size={18} style={{ color: COLORS.sea }} />
                  <span>
                    <span style={{ display: "block", fontWeight: 500, fontSize: 14 }}>A domicilio</span>
                    <span style={{ display: "block", fontSize: 12, color: "rgba(18,51,80,0.6)" }}>El doctor va a tu casa</span>
                  </span>
                </button>
              </div>
              {modality === "domicilio" && (
                <p style={{ marginTop: 14, display: "flex", gap: 8, fontSize: 12, color: "rgba(18,51,80,0.7)", background: COLORS.mist, borderRadius: 10, padding: "10px 12px" }}>
                  <HomeIcon size={14} style={{ flexShrink: 0, marginTop: 1, color: COLORS.sea }} />
                  {HOME_VISIT_INFO.coverage}. {HOME_VISIT_INFO.feeNote}
                </p>
              )}
            </section>
            <section className="ayc-card" style={{ padding: 26 }}>
              <h2 className="ayc-serif" style={{ margin: 0, fontSize: 19 }}>3. Elige el día</h2>
              <div style={{ marginTop: 16 }}><MonthCalendar doctor={doctor} appointments={appointments} selected={date} onSelect={handleDateChange} /></div>
            </section>
            <section className="ayc-card" style={{ padding: 26 }}>
              <h2 className="ayc-serif" style={{ margin: 0, fontSize: 19 }}>4. Elige la hora</h2>
              <div style={{ marginTop: 16 }}><TimeSlots doctor={doctor} appointments={appointments} dateKey={dateKey} selected={time} onSelect={setTime} /></div>
            </section>
          </div>
          <div>
            <section className="ayc-card" style={{ padding: 26 }}>
              <h2 className="ayc-serif" style={{ margin: 0, fontSize: 19 }}>5. Tus datos</h2>
              <ul style={{ marginTop: 16, listStyle: "none", padding: 14, borderRadius: 14, background: COLORS.mist, display: "flex", flexDirection: "column", gap: 10, fontSize: 13 }}>
                <li style={{ display: "flex", alignItems: "center", gap: 10 }}><UserRoundIcon size={15} style={{ color: COLORS.sea }} /> {doctor.name} · {doctor.specialty}</li>
                <li style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  {modality === "virtual" ? <VideoIcon size={15} style={{ color: COLORS.sea }} /> : modality === "domicilio" ? <HomeIcon size={15} style={{ color: COLORS.sea }} /> : <MapPinnedIcon size={15} style={{ color: COLORS.sea }} />}
                  {modality === "virtual" ? "Videoconsulta" : modality === "domicilio" ? "A domicilio" : "Presencial"}
                </li>
                <li style={{ display: "flex", alignItems: "center", gap: 10, color: dateKey ? COLORS.ink : "rgba(18,51,80,0.4)" }}><CalendarDaysIcon size={15} style={{ color: COLORS.sea }} /> {dateKey ? formatLongDate(dateKey) : "Sin fecha seleccionada"}</li>
                <li style={{ display: "flex", alignItems: "center", gap: 10, color: time ? COLORS.ink : "rgba(18,51,80,0.4)" }}><ClockIcon size={15} style={{ color: COLORS.sea }} /> {time ? formatTime(time) : "Sin hora seleccionada"}</li>
              </ul>
              <div style={{ marginTop: 20 }}><PatientForm ready={Boolean(dateKey && time)} modality={modality} onSubmit={handleSubmit} /></div>
            </section>
          </div>
        </div>
      </div>
    </main>
  );
}

/* ---------------- Página: Buscar mi cita (autoservicio del paciente) ---------------- */

function MyAppointments({ appointments, cancelAppointment, goBooking }) {
  const [phoneInput, setPhoneInput] = useState("");
  const [searched, setSearched] = useState(false);
  const [confirmingCancel, setConfirmingCancel] = useState(null);

  const matches = searched
    ? appointments
        .filter((a) => digitsOnly(a.phone).slice(-8) === digitsOnly(phoneInput).slice(-8) && digitsOnly(phoneInput).length >= 7)
        .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    : [];

  const handleSearch = (e) => {
    e.preventDefault();
    setSearched(true);
  };

  const handleCancel = (id) => {
    cancelAppointment(id);
    setConfirmingCancel(null);
  };

  return (
    <main style={{ background: COLORS.mist, padding: "56px 0", minHeight: "60vh" }}>
      <div style={{ maxWidth: 560, margin: "0 auto", padding: "0 20px" }}>
        <p style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: COLORS.sea, margin: 0 }}><SearchIcon size={16} /> Autoservicio</p>
        <h1 className="ayc-serif" style={{ marginTop: 8, fontSize: "clamp(1.6rem,3vw,2rem)" }}>Buscar mi cita</h1>
        <p style={{ marginTop: 8, color: "rgba(18,51,80,0.75)" }}>Escribe el teléfono con el que agendaste para ver y, si lo necesitas, cancelar tu cita.</p>

        <form onSubmit={handleSearch} className="ayc-card" style={{ marginTop: 20, padding: 20, display: "flex", gap: 10 }}>
          <input className="ayc-input" type="tel" value={phoneInput} onChange={(e) => { setPhoneInput(e.target.value); setSearched(false); }} placeholder="Ej. 0414 123 4567" />
          <button type="submit" className="ayc-btn ayc-btn-dark" style={{ flexShrink: 0 }}>Buscar</button>
        </form>

        {searched && (
          <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 12 }}>
            {matches.length === 0 && (
              <div className="ayc-card" style={{ padding: 24, textAlign: "center" }}>
                <p style={{ margin: 0, color: "rgba(18,51,80,0.7)" }}>No encontramos citas con ese teléfono.</p>
                <p style={{ margin: "6px 0 0", fontSize: 13, color: "rgba(18,51,80,0.55)" }}>Verifica que sea el mismo número con el que agendaste, o escríbenos por WhatsApp.</p>
              </div>
            )}
            {matches.map((a) => {
              const doctor = getDoctor(a.doctorId);
              const isPending = a.status === "pendiente";
              return (
                <div key={a.id} className="ayc-card" style={{ padding: 20 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, flexWrap: "wrap" }}>
                    <div>
                      <p style={{ margin: 0, fontWeight: 500 }}>{doctor.name} · {doctor.specialty}</p>
                      <p style={{ margin: "4px 0 0", fontSize: 14, color: "rgba(18,51,80,0.75)", textTransform: "capitalize" }}>{formatLongDate(a.date)} · {formatTime(a.time)}</p>
                      <p style={{ margin: "4px 0 0", display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: "rgba(18,51,80,0.6)" }}>
                        {a.modality === "virtual" ? <VideoIcon size={12} /> : a.modality === "domicilio" ? <HomeIcon size={12} /> : <MapPinnedIcon size={12} />} {a.modality === "virtual" ? "Videoconsulta" : a.modality === "domicilio" ? "A domicilio" : "Presencial"}
                      </p>
                      {a.modality === "domicilio" && a.homeAddress && (
                        <p style={{ margin: "4px 0 0", fontSize: 12, color: "rgba(18,51,80,0.6)" }}>{a.homeAddress}</p>
                      )}
                    </div>
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 5, borderRadius: 999, fontSize: 12, fontWeight: 500, padding: "4px 12px", background: isPending ? "#FEF3C7" : "#DCFCE7", color: isPending ? "#92400E" : "#166534" }}>
                      {isPending ? <HourglassIcon size={12} /> : <BadgeCheckIcon size={12} />} {isPending ? "Pendiente" : "Confirmada"}
                    </span>
                  </div>

                  {a.modality === "virtual" && (
                    a.meetingLink ? (
                      <a href={a.meetingLink} target="_blank" rel="noopener noreferrer" className="ayc-btn ayc-btn-dark" style={{ marginTop: 14, width: "100%" }}>
                        <VideoIcon size={16} /> Unirse a la videoconsulta
                      </a>
                    ) : (
                      <p style={{ marginTop: 14, fontSize: 12, color: "rgba(18,51,80,0.6)", display: "flex", gap: 6 }}>
                        <VideoIcon size={14} style={{ flexShrink: 0, marginTop: 1, color: COLORS.sea }} /> El consultorio te enviará el link por WhatsApp antes de tu cita.
                      </p>
                    )
                  )}

                  {confirmingCancel === a.id ? (
                    <div style={{ marginTop: 16, borderTop: `1px solid ${COLORS.sea100}`, paddingTop: 14 }}>
                      <p style={{ margin: 0, fontSize: 13, color: "rgba(18,51,80,0.8)" }}>¿Seguro que quieres cancelar esta cita?</p>
                      <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
                        <button onClick={() => handleCancel(a.id)} style={{ borderRadius: 999, border: "none", background: "#dc2626", color: "#fff", fontSize: 13, fontWeight: 500, padding: "8px 16px", cursor: "pointer" }}>Sí, cancelar</button>
                        <button onClick={() => setConfirmingCancel(null)} className="ayc-btn ayc-btn-outline" style={{ padding: "8px 16px" }}>Volver</button>
                      </div>
                    </div>
                  ) : (
                    <div style={{ display: "flex", gap: 10, marginTop: 16, borderTop: `1px solid ${COLORS.sea100}`, paddingTop: 14, flexWrap: "wrap" }}>
                      <button onClick={() => setConfirmingCancel(a.id)} style={{ borderRadius: 999, border: `1px solid ${COLORS.sea100}`, background: "#fff", color: "#dc2626", fontSize: 13, fontWeight: 500, padding: "8px 16px", cursor: "pointer" }}>Cancelar cita</button>
                      <a href={waLinkToPhone(CLINIC.whatsapp, `Hola, quisiera reprogramar mi cita del ${formatLongDate(a.date)} a las ${formatTime(a.time)} con ${doctor.name}.`)} target="_blank" rel="noopener noreferrer" className="ayc-btn ayc-btn-outline" style={{ padding: "8px 16px" }}>Solicitar cambio de horario</a>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        <p style={{ marginTop: 24, textAlign: "center", fontSize: 13, color: "rgba(18,51,80,0.6)" }}>
          ¿Aún no tienes cita? <button onClick={() => goBooking()} style={{ background: "none", border: "none", color: COLORS.sea, fontWeight: 500, cursor: "pointer", padding: 0 }}>Agenda una aquí</button>
        </p>
      </div>
    </main>
  );
}

function BlogPostForm({ initial, doctorOfSession, onSave, onCancel }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [doctorId, setDoctorId] = useState(initial?.doctorId || doctorOfSession || "beltran");
  const [excerpt, setExcerpt] = useState(initial?.excerpt || "");
  const [body, setBody] = useState(initial ? initial.content.join("\n\n") : "");
  const [readTime, setReadTime] = useState(initial?.readTime || "4 min");
  const [error, setError] = useState("");

  const handleSubmit = (e) => {
    e.preventDefault();
    if (title.trim().length < 5) { setError("El título es muy corto."); return; }
    if (excerpt.trim().length < 10) { setError("Escribe un extracto breve (una línea) para las tarjetas del blog."); return; }
    const paragraphs = body.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    if (paragraphs.length === 0) { setError("Escribe el contenido del artículo."); return; }
    setError("");
    const doctor = getDoctor(doctorId);
    onSave({
      slug: initial?.slug || slugify(title),
      title: title.trim(),
      excerpt: excerpt.trim(),
      doctorId,
      category: doctor.specialty,
      publishedAt: initial?.publishedAt || toKey(new Date()),
      readTime: readTime.trim() || "4 min",
      content: paragraphs
    });
  };

  return (
    <form onSubmit={handleSubmit} className="ayc-card" style={{ padding: 24, display: "flex", flexDirection: "column", gap: 16, marginTop: 20 }}>
      <div>
        <label style={{ fontSize: 13, fontWeight: 500 }}>Firma como</label>
        <select className="ayc-input" style={{ marginTop: 6 }} value={doctorId} onChange={(e) => setDoctorId(e.target.value)}>
          {DOCTORS.map((d) => <option key={d.id} value={d.id}>{d.name} · {d.specialty}</option>)}
        </select>
      </div>
      <div>
        <label style={{ fontSize: 13, fontWeight: 500 }}>Título</label>
        <input className="ayc-input" style={{ marginTop: 6 }} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ej. 5 señales de la anemia que no debes ignorar" />
      </div>
      <div>
        <label style={{ fontSize: 13, fontWeight: 500 }}>Extracto (una línea, aparece en las tarjetas)</label>
        <input className="ayc-input" style={{ marginTop: 6 }} value={excerpt} onChange={(e) => setExcerpt(e.target.value)} placeholder="Resumen breve del artículo" />
      </div>
      <div>
        <label style={{ fontSize: 13, fontWeight: 500 }}>Contenido</label>
        <textarea className="ayc-input" style={{ marginTop: 6, resize: "vertical" }} rows={10} value={body} onChange={(e) => setBody(e.target.value)} placeholder={"Escribe el artículo. Deja una línea en blanco entre párrafos."} />
      </div>
      <div>
        <label style={{ fontSize: 13, fontWeight: 500 }}>Tiempo de lectura</label>
        <input className="ayc-input" style={{ marginTop: 6, maxWidth: 160 }} value={readTime} onChange={(e) => setReadTime(e.target.value)} placeholder="4 min" />
      </div>
      {error && <p style={{ margin: 0, fontSize: 13, color: "#dc2626" }}>{error}</p>}
      <div style={{ display: "flex", gap: 10 }}>
        <button type="submit" className="ayc-btn ayc-btn-dark">{initial ? "Guardar cambios" : "Publicar artículo"}</button>
        <button type="button" onClick={onCancel} className="ayc-btn ayc-btn-outline">Cancelar</button>
      </div>
    </form>
  );
}

function BlogAdmin({ posts, addPost, updatePost, deletePost }) {
  const [mode, setMode] = useState("list"); // list | new | edit
  const [editingSlug, setEditingSlug] = useState(null);

  const editingPost = editingSlug ? posts.find((p) => p.slug === editingSlug) : null;

  const handleSave = (postData) => {
    if (mode === "edit" && editingPost) updatePost(editingPost.slug, postData);
    else addPost(postData);
    setMode("list");
    setEditingSlug(null);
  };

  if (mode === "new") {
    return <BlogPostForm onSave={handleSave} onCancel={() => setMode("list")} />;
  }
  if (mode === "edit" && editingPost) {
    return <BlogPostForm initial={editingPost} onSave={handleSave} onCancel={() => { setMode("list"); setEditingSlug(null); }} />;
  }

  return (
    <div style={{ marginTop: 20 }}>
      <button onClick={() => setMode("new")} className="ayc-btn ayc-btn-dark">
        <BookOpenIcon size={16} /> Nuevo artículo
      </button>
      <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 10 }}>
        {posts.length === 0 && (
          <p style={{ padding: 24, textAlign: "center", color: "rgba(18,51,80,0.6)" }}>Todavía no hay artículos publicados.</p>
        )}
        {posts.map((post) => {
          const doctor = getDoctor(post.doctorId);
          return (
            <div key={post.slug} className="ayc-card" style={{ padding: 18, display: "flex", flexWrap: "wrap", gap: 14, alignItems: "center" }}>
              <div style={{ flex: 1, minWidth: 200 }}>
                <span style={{ display: "inline-flex", borderRadius: 999, background: COLORS.mist, color: COLORS.sea, fontSize: 11, fontWeight: 600, padding: "3px 10px" }}>{post.category}</span>
                <p style={{ margin: "8px 0 0", fontWeight: 500 }}>{post.title}</p>
                <p style={{ margin: "2px 0 0", fontSize: 12, color: "rgba(18,51,80,0.6)" }}>{doctor.name} · <span style={{ textTransform: "capitalize" }}>{formatLongDate(post.publishedAt)}</span></p>
              </div>
              <button onClick={() => { setEditingSlug(post.slug); setMode("edit"); }} style={{ borderRadius: 999, border: `1px solid ${COLORS.sea100}`, background: "#fff", color: COLORS.ink, fontSize: 12, fontWeight: 500, padding: "8px 14px", cursor: "pointer" }}>Editar</button>
              <button onClick={() => deletePost(post.slug)} aria-label={`Eliminar ${post.title}`} style={{ width: 36, height: 36, borderRadius: "50%", border: `1px solid ${COLORS.sea100}`, background: "#fff", display: "grid", placeItems: "center", color: "rgba(18,51,80,0.6)", cursor: "pointer" }}>
                <Trash2Icon size={15} />
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

    setMeetingLink(appointment.id, value.trim());

    post: { title: activePost ? `${activePost.title} | Almas & Células` : "Artículo | Almas & Células", description: activePost ? activePost.excerpt : "Artículo del blog de Almas & Células." },
    misCitas: { title: "Buscar mi cita | Almas & Células", description: "Consulta, cancela o reprograma tu cita en Almas & Células." },
    privacidad: { title: "Política de privacidad | Almas & Células", description: "Cómo protegemos y usamos tus datos en Almas & Células." },
    admin: { title: "Panel del consultorio | Almas & Células", description: "Acceso interno para el equipo de Almas & Células." }
  };
  const meta = pageMeta[page] || pageMeta.home;
  useDocumentMeta(meta.title, meta.description);
  const goPost = useCallback((slug) => { setActivePostSlug(slug); setPage("post"); window.scrollTo(0,0); }, []);
  const goSection = useCallback((id) => {
    if (page !== "home") { setPage("home"); setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: "smooth" }), 80); return; }
    document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
  }, [page]);

  const addAppointment = useCallback((created) => {
    setAppointments((prev) => [...prev, created]);
  }, []);
  const cancelAppointment = useCallback((id) => {
    setAppointments((prev) => prev.filter((a) => a.id !== id));
  }, []);
  const confirmAppointment = useCallback((id) => {
    setAppointments((prev) => prev.map((a) => (a.id === id ? { ...a, status: "confirmada" } : a)));
  }, []);
  const setMeetingLink = useCallback((id, link) => {
    setAppointments((prev) => prev.map((a) => (a.id === id ? { ...a, meetingLink: link } : a)));
  }, []);

  const addPost = useCallback((postData) => {
    setPosts((prev) => {
      let slug = postData.slug;
      let n = 2;
      while (prev.some((p) => p.slug === slug)) { slug = `${postData.slug}-${n}`; n++; }
      return [{ ...postData, slug }, ...prev];
    });
  }, []);
  const updatePost = useCallback((slug, postData) => {
    setPosts((prev) => prev.map((p) => (p.slug === slug ? { ...postData, slug } : p)));
  }, []);
  const deletePost = useCallback((slug) => {
    setPosts((prev) => prev.filter((p) => p.slug !== slug));
  }, []);

  return (
    <div className="ayc" style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <GlobalStyle />
      <Header page={page} goHome={goHome} goSection={goSection} goBooking={goBooking} goAdmin={goAdmin} goBlog={goBlog} />
      <div style={{ flex: 1 }} key={page} className="ayc-page-enter">
        {page === "home" && (
          <main>
            <Hero goBooking={goBooking} />
            <Specialties goBooking={goBooking} />
            <DoctorsSection goBooking={goBooking} goDoctorProfile={goDoctorProfile} />
            <Testimonials />
            <BlogTeaser posts={posts} goBlog={goBlog} goPost={goPost} />
            <HowItWorks goBooking={goBooking} />
            <FAQSection />
            <ContactSection />
          </main>
        )}
        {page === "booking" && <Booking initialDoctor={bookingDoctor} appointments={appointments} addAppointment={addAppointment} />}
        {page === "admin" && <Admin appointments={appointments} cancelAppointment={cancelAppointment} confirmAppointment={confirmAppointment} setMeetingLink={setMeetingLink} posts={posts} addPost={addPost} updatePost={updatePost} deletePost={deletePost} />}
        {page === "blog" && <Blog posts={posts} goPost={goPost} />}
        {page === "post" && <BlogPostPage post={posts.find((p) => p.slug === activePostSlug)} goBlog={goBlog} goBooking={goBooking} />}
        {page === "misCitas" && <MyAppointments appointments={appointments} cancelAppointment={cancelAppointment} goBooking={goBooking} />}
        {page === "privacidad" && <PrivacyPolicy goHome={goHome} />}
        {page === "doctor" && <DoctorProfilePage doctorId={activeDoctorProfile} goHome={goHome} goBooking={goBooking} />}
      </div>
      <Footer goAdmin={goAdmin} goMyAppointments={goMyAppointments} goPrivacy={goPrivacy} />
      <WhatsAppFab />
      <MobileTabBar page={page} goHome={goHome} goBooking={goBooking} goBlog={goBlog} goMyAppointments={goMyAppointments} />
    </div>
  );
}


import { createRoot } from "react-dom/client";
createRoot(document.getElementById("root")).render(<App />);

document.getElementById("loading").remove();
</script>
</body>
</html>
